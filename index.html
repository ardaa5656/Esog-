<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESOGÜ MEYDAN // Kampüsün Nabzı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Kalıcı & Cihazlar Arası Canlı WSS Ağı (Hesapsız/Key'siz) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #06090f;
      color: #e2e8f0;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.7) 0%, rgba(10, 15, 26, 0.8) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-nav {
      background: rgba(6, 9, 15, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .neon-glow {
      box-shadow: 0 0 25px -5px rgba(45, 212, 191, 0.25);
    }
    /* Hide scrollbar */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between border-x border-slate-900 selection:bg-brand-500 selection:text-black">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-40 bg-[#06090f]/90 backdrop-blur-md border-b border-slate-900 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-sky-500 flex items-center justify-center font-display font-bold text-black text-base shadow-lg shadow-brand-500/20">
        E
      </div>
      <div>
        <h1 class="font-display font-bold text-sm tracking-wide text-white uppercase flex items-center gap-1.5">
          ESOGÜ MEYDAN
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-400 animate-ping"></span>
        </h1>
        <p class="text-[10px] text-slate-500 tracking-tight font-medium">Meşelik • Porsuk • Sivrihisar</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="sync-status" class="text-[10px] bg-slate-900 text-slate-400 border border-slate-800 px-2 py-0.5 rounded-full font-mono flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> CANLI
      </span>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 p-4 pb-24 space-y-4">

    <!-- 1. SEKME: DERTLER & İTİRAF (24 SAATTE SİLİNİR) -->
    <section id="sec-feed" class="space-y-4">
      <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 shadow-xl space-y-2.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400 font-semibold tracking-wider text-[11px] uppercase">Gündem / İtiraf</span>
          <span class="text-[10px] text-amber-400/90 bg-amber-400/10 px-2 py-0.5 rounded font-mono">24s sonra silinir</span>
        </div>
        <textarea id="feed-text" class="w-full bg-slate-950/80 p-3 rounded-xl text-sm text-slate-100 border border-slate-800/80 focus:outline-none focus:border-brand-500 transition resize-none placeholder:text-slate-600" rows="3" placeholder="Yurtta sular mı kesik? Hoca ne yaptı? Anonim yaz..."></textarea>
        
        <div class="flex items-center justify-between pt-1">
          <select id="feed-tag" class="bg-slate-950 text-xs text-slate-300 font-medium px-2.5 py-1.5 rounded-lg border border-slate-800 focus:outline-none">
            <option value="Dert">#Dert</option>
            <option value="KYK">#KYK</option>
            <option value="Meşelik">#Meşelik</option>
            <option value="İtiraf">#İtiraf</option>
            <option value="Yemekhane">#Yemekhane</option>
          </select>
          <button onclick="publishMessage('feed')" class="bg-gradient-to-r from-brand-500 to-sky-500 text-black font-semibold text-xs px-4 py-2 rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition">
            Ateşle
          </button>
        </div>
      </div>

      <div id="list-feed" class="space-y-3"></div>
    </section>

    <!-- 2. SEKME: AKADEMİ & NOTLAR (KALICI - ASLA SİLİNMEZ) -->
    <section id="sec-academic" class="space-y-4 hidden">
      <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 shadow-xl space-y-2.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400 font-semibold tracking-wider text-[11px] uppercase">Akademi Arşivi</span>
          <span class="text-[10px] text-emerald-400/90 bg-emerald-400/10 px-2 py-0.5 rounded font-mono">Kalıcı Arşiv</span>
        </div>
        <input id="acad-title" type="text" placeholder="Ders Kodu & Hoca (Örn: HUK101 - Ali Hoca)" class="w-full bg-slate-950/80 px-3 py-2 rounded-xl text-sm text-slate-100 border border-slate-800/80 focus:outline-none focus:border-brand-500 transition placeholder:text-slate-600">
        <textarea id="acad-text" class="w-full bg-slate-950/80 p-3 rounded-xl text-sm text-slate-100 border border-slate-800/80 focus:outline-none focus:border-brand-500 transition resize-none placeholder:text-slate-600" rows="3" placeholder="Sınav tüyoları, çıkmış sorular, PDF Drive linki..."></textarea>
        
        <button onclick="publishMessage('academic')" class="w-full bg-gradient-to-r from-brand-500 to-sky-500 text-black font-semibold text-xs py-2.5 rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition">
          Notu Arşive Ekle
        </button>
      </div>

      <div id="list-academic" class="space-y-3"></div>
    </section>

    <!-- 3. SEKME: YOLDAŞ (24 SAATTE SİLİNİR) -->
    <section id="sec-meetup" class="space-y-4 hidden">
      <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 shadow-xl space-y-2.5">
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400 font-semibold tracking-wider text-[11px] uppercase">Anlık Eşleşme</span>
          <span class="text-[10px] text-amber-400/90 bg-amber-400/10 px-2 py-0.5 rounded font-mono">24s sonra silinir</span>
        </div>
        <input id="meet-title" type="text" placeholder="Aktivite / İhtiyaç (Örn: Kütüphane sabahlaması)" class="w-full bg-slate-950/80 px-3 py-2 rounded-xl text-sm text-slate-100 border border-slate-800/80 focus:outline-none focus:border-brand-500 transition placeholder:text-slate-600">
        <input id="meet-contact" type="text" placeholder="İletişim (Telegram @rumuz veya IG profili)" class="w-full bg-slate-950/80 px-3 py-2 rounded-xl text-sm text-slate-100 border border-slate-800/80 focus:outline-none focus:border-brand-500 transition placeholder:text-slate-600">
        
        <button onclick="publishMessage('meetup')" class="w-full bg-gradient-to-r from-brand-500 to-sky-500 text-black font-semibold text-xs py-2.5 rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition">
          Yoldaş İlanı Bırak
        </button>
      </div>

      <div id="list-meetup" class="space-y-3"></div>
    </section>

  </main>

  <!-- BOTTOM BAR NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav px-3 py-2.5 flex items-center justify-around z-50">
    <button onclick="switchTab('feed')" id="tab-btn-feed" class="flex flex-col items-center gap-1 text-brand-400 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
      <span class="text-[11px] font-semibold tracking-tight">Akış</span>
    </button>
    <button onclick="switchTab('academic')" id="tab-btn-academic" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span class="text-[11px] font-semibold tracking-tight">Notlar</span>
    </button>
    <button onclick="switchTab('meetup')" id="tab-btn-meetup" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span class="text-[11px] font-semibold tracking-tight">Yoldaş</span>
    </button>
  </nav>

  <script>
    // 24 SAAT SÜRE LİMİTİ (Milisaniye)
    const TTL_24H = 24 * 60 * 60 * 1000;

    // LOCAL STORAGE MERKEZİ (Hem hızlı yükleme hem kalıcılık)
    let state = {
      feeds: JSON.parse(localStorage.getItem('esogu_feeds') || '[]'),
      academic: JSON.parse(localStorage.getItem('esogu_academic') || '[]'),
      meetups: JSON.parse(localStorage.getItem('esogu_meetups') || '[]')
    };

    // TÜM CİHAZLARI BİRBİRİNE BAĞLAYAN AÇIK MQTT WSS ODASI
    const TOPIC = 'esogu/meydan/v2_sync_channel';
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'esogu_' + Math.random().toString(16).substring(2, 8),
      clean: true,
      reconnectPeriod: 2000
    });

    client.on('connect', () => {
      document.getElementById('sync-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> SENKRONİZE';
      client.subscribe(TOPIC);
      // Yeni bağlanan cihaz odaya ping atar, odadaki diğer aktif cihazlar ona veritabanını paslar
      client.publish(TOPIC, JSON.stringify({ type: 'DISCOVERY' }));
    });

    client.on('message', (topic, payload) => {
      try {
        const msg = JSON.parse(payload.toString());
        
        if (msg.type === 'DISCOVERY') {
          // Birisi odaya yeni girdi, arşivimizi ona gönderelim
          client.publish(TOPIC, JSON.stringify({
            type: 'STATE_SHARE',
            data: state
          }));
        } 
        else if (msg.type === 'STATE_SHARE') {
          // Başka cihazdan gelen veriyi birleştir
          mergeData(msg.data);
        }
        else if (msg.type === 'NEW_ITEM') {
          addItemLocally(msg.category, msg.item, false);
        }
        else if (msg.type === 'LIKE') {
          const post = state.feeds.find(p => p.id === msg.id);
          if (post) {
            post.likes = (post.likes || 0) + 1;
            persistAndRender();
          }
        }
      } catch (err) {
        console.error(err);
      }
    });

    function cleanExpiredData() {
      const now = Date.now();
      // 1. Dertler & İtiraf -> 24 SAAT DOLUNCA SİLİNİR
      state.feeds = state.feeds.filter(item => (now - item.time) < TTL_24H);
      // 2. Yoldaş -> 24 SAAT DOLUNCA SİLİNİR
      state.meetups = state.meetups.filter(item => (now - item.time) < TTL_24H);
      // 3. Notlar -> ASLA SİLİNMEZ (Dokunulmaz)
    }

    function mergeData(remote) {
      if (!remote) return;
      
      const mergeList = (local, incoming) => {
        const map = new Map();
        local.forEach(i => map.set(i.id, i));
        incoming.forEach(i => {
          if (!map.has(i.id)) {
            map.set(i.id, i);
          } else {
            // Beğeni gibi güncellemeleri koru
            const cur = map.get(i.id);
            if ((i.likes || 0) > (cur.likes || 0)) cur.likes = i.likes;
          }
        });
        return Array.from(map.values());
      };

      state.feeds = mergeList(state.feeds, remote.feeds || []);
      state.academic = mergeList(state.academic, remote.academic || []);
      state.meetups = mergeList(state.meetups, remote.meetups || []);

      persistAndRender();
    }

    function persistAndRender() {
      cleanExpiredData();
      localStorage.setItem('esogu_feeds', JSON.stringify(state.feeds));
      localStorage.setItem('esogu_academic', JSON.stringify(state.academic));
      localStorage.setItem('esogu_meetups', JSON.stringify(state.meetups));
      render();
    }

    function addItemLocally(cat, item, shouldBroadcast = true) {
      if (cat === 'feed') state.feeds.unshift(item);
      if (cat === 'academic') state.academic.unshift(item);
      if (cat === 'meetup') state.meetups.unshift(item);

      persistAndRender();

      if (shouldBroadcast && client.connected) {
        client.publish(TOPIC, JSON.stringify({
          type: 'NEW_ITEM',
          category: cat,
          item: item
        }));
      }
    }

    function publishMessage(type) {
      const now = Date.now();

      if (type === 'feed') {
        const text = document.getElementById('feed-text').value.trim();
        const tag = document.getElementById('feed-tag').value;
        if (!text) return;

        const item = {
          id: 'f_' + now + '_' + Math.random().toString(16).substring(2, 6),
          text: text,
          tag: tag,
          likes: 0,
          time: now
        };
        addItemLocally('feed', item, true);
        document.getElementById('feed-text').value = '';
      } 
      else if (type === 'academic') {
        const title = document.getElementById('acad-title').value.trim();
        const text = document.getElementById('acad-text').value.trim();
        if (!title || !text) return;

        const item = {
          id: 'a_' + now + '_' + Math.random().toString(16).substring(2, 6),
          title: title,
          text: text,
          time: now
        };
        addItemLocally('academic', item, true);
        document.getElementById('acad-title').value = '';
        document.getElementById('acad-text').value = '';
      } 
      else if (type === 'meetup') {
        const title = document.getElementById('meet-title').value.trim();
        const contact = document.getElementById('meet-contact').value.trim();
        if (!title || !contact) return;

        const item = {
          id: 'm_' + now + '_' + Math.random().toString(16).substring(2, 6),
          title: title,
          contact: contact,
          time: now
        };
        addItemLocally('meetup', item, true);
        document.getElementById('meet-title').value = '';
        document.getElementById('meet-contact').value = '';
      }
    }

    function sendLike(id) {
      const post = state.feeds.find(p => p.id === id);
      if (post) {
        post.likes = (post.likes || 0) + 1;
        persistAndRender();
        if (client.connected) {
          client.publish(TOPIC, JSON.stringify({ type: 'LIKE', id: id }));
        }
      }
    }

    function render() {
      const now = Date.now();

      // 1. FEED RENDER
      const feedEl = document.getElementById('list-feed');
      feedEl.innerHTML = state.feeds.sort((a,b) => b.time - a.time).map(item => {
        const remHours = Math.max(1, Math.round((TTL_24H - (now - item.time)) / 3600000));
        return `
          <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 space-y-2.5">
            <div class="flex justify-between items-center text-xs">
              <span class="text-brand-400 font-semibold tracking-wide text-[11px] bg-brand-500/10 px-2 py-0.5 rounded">#${escape(item.tag)}</span>
              <div class="flex items-center gap-2 text-slate-500 text-[10px] font-mono">
                <span>${remHours}s sonra silinir</span>
                <span>•</span>
                <span>${new Date(item.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              </div>
            </div>
            <p class="text-sm text-slate-200 leading-relaxed font-normal">${escape(item.text)}</p>
            <div class="flex justify-end pt-1">
              <button onclick="sendLike('${item.id}')" class="flex items-center gap-1.5 text-xs bg-slate-900/90 border border-slate-800 hover:border-brand-500/50 px-3 py-1 rounded-xl text-slate-300 active:scale-95 transition">
                <span class="text-brand-400">▲</span>
                <span class="font-mono font-medium">${item.likes || 0}</span>
              </button>
            </div>
          </div>
        `;
      }).join('') || '<div class="text-center py-10 text-xs text-slate-600">Henüz itiraf yok. İlk bombayı sen patlat.</div>';

      // 2. ACADEMIC RENDER (KALICI)
      const acadEl = document.getElementById('list-academic');
      acadEl.innerHTML = state.academic.sort((a,b) => b.time - a.time).map(item => {
        return `
          <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 space-y-2">
            <div class="flex justify-between items-center">
              <h3 class="text-sm font-display font-bold text-white tracking-wide">${escape(item.title)}</h3>
              <span class="text-[9px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-1.5 py-0.5 rounded font-mono">ARŞİV</span>
            </div>
            <p class="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed">${autoLink(escape(item.text))}</p>
            <div class="text-[10px] text-slate-600 font-mono text-right">
              ${new Date(item.time).toLocaleDateString('tr-TR')}
            </div>
          </div>
        `;
      }).join('') || '<div class="text-center py-10 text-xs text-slate-600">Kalıcı not arşivi boş. Çıkmış veya ders notu bırak.</div>';

      // 3. MEETUP RENDER
      const meetEl = document.getElementById('list-meetup');
      meetEl.innerHTML = state.meetups.sort((a,b) => b.time - a.time).map(item => {
        const remHours = Math.max(1, Math.round((TTL_24H - (now - item.time)) / 3600000));
        return `
          <div class="glass-card p-3.5 rounded-2xl border border-slate-800/80 flex items-center justify-between gap-3">
            <div class="space-y-1">
              <p class="text-sm font-medium text-slate-100">${escape(item.title)}</p>
              <div class="text-xs text-slate-400">İletişim: <span class="text-brand-400 font-mono select-all">${escape(item.contact)}</span></div>
            </div>
            <span class="text-[9px] bg-slate-900 text-amber-400/80 border border-slate-800 px-2 py-1 rounded-lg font-mono whitespace-nowrap">${remHours}s kaldı</span>
          </div>
        `;
      }).join('') || '<div class="text-center py-10 text-xs text-slate-600">Aktif ilan yok. Bir masa arkadaşı veya rota ara.</div>';
    }

    function switchTab(tab) {
      ['feed', 'academic', 'meetup'].forEach(t => {
        document.getElementById('sec-' + t).classList.add('hidden');
        document.getElementById('tab-btn-' + t).className = 'flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 transition';
      });
      document.getElementById('sec-' + tab).classList.remove('hidden');
      document.getElementById('tab-btn-' + tab).className = 'flex flex-col items-center gap-1 text-brand-400 transition';
    }

    function escape(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function autoLink(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, url => `<a href="${url}" target="_blank" class="text-sky-400 underline font-mono break-all">${url}</a>`);
    }

    // İlk çalıştırma ve 60 saniyede bir otomatik süre temizliği
    persistAndRender();
    setInterval(cleanExpiredData, 60000);
  </script>
</body>
</html>
